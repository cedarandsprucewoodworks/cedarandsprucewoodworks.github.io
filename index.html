<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cedar & Spruce | Coming Soon</title>
  <meta name="description" content="Cedar & Spruce is refreshing the website. Handcrafted cedar planter boxes, raised beds, and window boxes are coming back soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Lato', sans-serif; background: #f7f2ea; color: #2e1f0f; }
    a { color: inherit; text-decoration: none; }
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, rgba(15, 20, 13, 0.65) 0%, rgba(15, 20, 13, 0.65) 100%),
        url('Assets/cedar-sprig.jpg') center/cover no-repeat;
    }
    .hero-inner {
      max-width: 820px;
      text-align: center;
      color: #ffffff;
      padding: 72px 32px;
      border-radius: 24px;
      backdrop-filter: blur(8px);
      background: rgba(12, 18, 12, 0.35);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.22);
    }
    .logo {
      display: block;
      width: min(260px, 70vw);
      height: auto;
      margin: 0 auto 28px;
      border-radius: 12px;
    }
    .eyebrow {
      display: inline-flex;
      margin-bottom: 20px;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d4e8cf;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 5vw, 4.8rem);
      line-height: 1.02;
      margin-bottom: 20px;
      color: #f9f5ee;
    }
    p {
      margin: 0 auto 32px;
      max-width: 620px;
      font-size: 1.05rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.87);
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #2d5a27;
      color: #ffffff;
      border: 2px solid #2d5a27;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.28);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
    }
    .info {
      background: #ffffff;
      color: #2e1f0f;
      text-align: center;
      padding: 70px 24px 40px;
    }
    .info h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 3vw, 2.8rem);
      margin-bottom: 18px;
      color: #2e1f0f;
    }
    .info p {
      max-width: 680px;
      margin: 0 auto;
      font-size: 1rem;
      line-height: 1.8;
      color: #5a4635;
    }
    .note {
      margin-top: 24px;
      font-size: 0.92rem;
      color: #7a624f;
    }
    footer {
      padding: 24px 24px 40px;
      text-align: center;
      font-size: 0.9rem;
      color: #7a624f;
    }
    footer a { text-decoration: underline; }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }
    .modal-content {
      background-color: #ffffff;
      margin: 10% auto;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.3);
    }
    .modal h2 {
      font-family: 'Playfair Display', serif;
      color: #2e1f0f;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    .modal input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid #d4d4d4;
      border-radius: 6px;
      font-size: 1rem;
      font-family: 'Lato', sans-serif;
    }
    .modal input:focus {
      outline: none;
      border-color: #2d5a27;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal button {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: transform 0.22s ease;
    }
    .modal button:hover {
      transform: translateY(-2px);
    }
    .btn-submit {
      background: #2d5a27;
      color: #ffffff;
    }
    .btn-cancel {
      background: #e0e0e0;
      color: #2e1f0f;
    }
    .error-message {
      color: #d32f2f;
      margin-bottom: 15px;
      font-size: 0.9rem;
      display: none;
    }
    @media (max-width: 660px) {
      .hero-inner { padding: 48px 20px; }
      .buttons { flex-direction: column; }
      .modal-content { width: 85%; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="hero-inner">
      <img class="logo" src="Assets/cedar-spruce-logo-white-bg.png" alt="Cedar & Spruce Handcrafted Woodworks" />
      <h1>Currently refreshing our website for a better shop experience.</h1>
      <span class="eyebrow">Thanks for your patience!</span>
      <div class="buttons">
        <button onclick="openPasswordModal()" class="btn btn-primary">View Full Site</button>
      </div>
    </div>
  </main>

  <div id="passwordModal" class="modal">
    <div class="modal-content">
      <h2>Access Full Site</h2>
      <div class="error-message" id="errorMessage">Incorrect password. Please try again.</div>
      <input type="password" id="passwordInput" placeholder="Enter password" onkeypress="handleEnter(event)" />
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closePasswordModal()">Cancel</button>
        <button class="btn-submit" onclick="checkPassword()">Submit</button>
      </div>
    </div>
  </div>

  <script>
    function openPasswordModal() {
      document.getElementById('passwordModal').style.display = 'block';
      document.getElementById('passwordInput').focus();
      document.getElementById('errorMessage').style.display = 'none';
    }

    function closePasswordModal() {
      document.getElementById('passwordModal').style.display = 'none';
      document.getElementById('passwordInput').value = '';
      document.getElementById('errorMessage').style.display = 'none';
    }

    function checkPassword() {
      const password = document.getElementById('passwordInput').value;
      const correctPassword = 'Cedar';
      
      if (password === correctPassword) {
        window.location.href = 'full-site.html';
      } else {
        document.getElementById('errorMessage').style.display = 'block';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    }

    function handleEnter(event) {
      if (event.key === 'Enter') {
        checkPassword();
      }
    }

    window.onclick = function(event) {
      const modal = document.getElementById('passwordModal');
      if (event.target === modal) {
        closePasswordModal();
      }
    }
  </script>
</body>
</html>
